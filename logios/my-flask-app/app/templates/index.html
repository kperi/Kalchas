{% extends "layout.html" %}

{% block title %}Welcome - Logios App{% endblock %}

{% block content %}
<div class="gradio-component-group text-center">
    <h1>Welcome to Logios Document Processing</h1>
    <p style="font-size: var(--text-lg); color: var(--gray-600); margin-bottom: var(--space-8);">
       Transform your documents with advanced polytonic OCR technology
    </p>
    <div class="button-group flex justify-center gap-4">
        <a href="{{ url_for('app.show_upload_page') }}" class="gradio-button gradio-button-primary gradio-button-large">
            📄 Upload a Document
        </a>
        <a href="{{ url_for('app.image_preview') }}" class="gradio-button gradio-button-outline gradio-button-large">
            🔍 View Documents
        </a>
    </div>
</div>
{% endblock %}
