<script>
    // CSS for contenteditable placeholder
    const style = document.createElement('style');
    style.textContent = `
        #ocr-result:empty:before {
            content: attr(data-placeholder);
            color: #999;
            pointer-events: none;
        }
        
        #ocr-result:focus:empty:before {
            content: "";
        }
    `;
    document.head.appendChild(style);

    // Document selection and navigation variables
    const pngSelect = document.getElementById('png-select');
    const selectedDocumentInfo = document.getElementById('selected-document-info');
    const currentDocumentName = document.getElementById('current-document-name');
    const pageSelectionContainer = document.getElementById('page-selection-container');
    const documentDisplayContainer = document.getElementById('document-display-container');
    
    // Current state
    let currentFolder = '{{ selected_folder or "" }}';
    let currentPage = '{{ request.args.get("selected_png") or "" }}';
    const userId = '{{ session.get("user_id", "anonymous") }}';
    
    // URL state management without page reloads
    function updateBrowserURL(folder, page) {
        const url = new URL(window.location);
        if (folder) {
            url.searchParams.set('selected_folder', folder);
        } else {
            url.searchParams.delete('selected_folder');
        }
        if (page) {
            url.searchParams.set('selected_png', page);
        } else {
            url.searchParams.delete('selected_png');
        }
        
        // Update URL without page reload
        window.history.pushState({
            folder: folder,
            page: page
        }, '', url.toString());
    }
    
    // Handle browser back/forward navigation
    window.addEventListener('popstate', function(event) {
        if (event.state) {
            const { folder, page } = event.state;
            
            if (folder !== currentFolder) {
                // Navigate to different folder
                if (folder) {
                    selectDocument(folder);
                } else {
                    // Clear selection
                    currentFolder = '';
                    currentPage = '';
                    hidePageSelection();
                    const documentDisplayContainer = document.getElementById('document-display-container');
                    if (documentDisplayContainer) {
                        documentDisplayContainer.innerHTML = `
                            <div class="gradio-display-area">
                                <p class="gradio-placeholder-text">Please select an OCR-ready document from the sidebar.</p>
                            </div>
                        `;
                    }
                    hideOCRControls();
                    clearSegmentData();
                    if (selectedDocumentInfo) {
                        selectedDocumentInfo.style.display = 'none';
                    }
                    // Clear sidebar selection
                    document.querySelectorAll('.document-item').forEach(item => {
                        item.classList.remove('selected');
                    });
                }
            }
            
            if (page !== currentPage && folder) {
                // Navigate to different page
                if (page) {
                    currentPage = page;
                    if (pngSelect) {
                        pngSelect.value = page;
                    }
                    loadPage(folder, page);
                } else {
                    // No page selected, but folder is selected
                    const documentDisplayContainer = document.getElementById('document-display-container');
                    if (documentDisplayContainer) {
                        documentDisplayContainer.innerHTML = `
                            <div class="gradio-display-area">
                                <p class="gradio-placeholder-text">Please select a page to preview and perform OCR.</p>
                            </div>
                        `;
                    }
                    hideOCRControls();
                    clearSegmentData();
                }
            }
        }
    });

    // Sidebar document selection handler
    function setupSidebarDocumentSelection() {
        const documentItems = document.querySelectorAll('.document-item');
        documentItems.forEach(item => {
            item.addEventListener('click', function(e) {
                const documentName = this.getAttribute('data-document-name');
                if (documentName && documentName !== currentFolder) {
                    selectDocument(documentName);
                }
            });
        });
    }
    
    // Function to select a document
    function selectDocument(documentName) {
        console.log('[selectDocument] Selecting document:', documentName);
        
        // Update current state
        currentFolder = documentName;
        currentPage = '';
        
        // Update browser URL
        updateBrowserURL(documentName, '');
        
        // Update sidebar selection
        document.querySelectorAll('.document-item').forEach(item => {
            item.classList.remove('selected');
        });
        const selectedItem = document.querySelector(`[data-document-name="${documentName}"]`);
        if (selectedItem) {
            selectedItem.classList.add('selected');
        }
        
        // Update main content
        if (currentDocumentName) {
            currentDocumentName.textContent = documentName;
        }
        if (selectedDocumentInfo) {
            selectedDocumentInfo.style.display = 'block';
        }
        
        // Clear any existing page data and show placeholder
        const documentDisplayContainer = document.getElementById('document-display-container');
        if (documentDisplayContainer) {
            documentDisplayContainer.innerHTML = `
                <div class="gradio-display-area">
                    <p class="gradio-placeholder-text">Please select a page to preview and perform OCR.</p>
                </div>
            `;
        }
        
        // Hide OCR controls until a page is selected
        hideOCRControls();
        clearSegmentData();
        
        // Load document pages via AJAX
        loadDocumentPages(documentName);
    }
    
    // Function to setup page selection event listener
    function setupPageSelectionListener() {
        const pngSelect = document.getElementById('png-select');
        if (pngSelect && !pngSelect.hasAttribute('data-listener-added')) {
            pngSelect.addEventListener('change', function(event) {
                const selectedPage = this.value;
                currentPage = selectedPage;
                
                // Update browser URL without page reload
                updateBrowserURL(currentFolder, selectedPage);
                
                if (selectedPage && currentFolder) {
                    // Load page via AJAX instead of page reload
                    loadPage(currentFolder, selectedPage);
                } else {
                    // No page selected - hide preview and OCR controls
                    const documentDisplayContainer = document.getElementById('document-display-container');
                    if (documentDisplayContainer) {
                        if (currentFolder) {
                            // Document selected but no page
                            documentDisplayContainer.innerHTML = `
                                <div class="gradio-display-area">
                                    <p class="gradio-placeholder-text">Please select a page to preview and perform OCR.</p>
                                </div>
                            `;
                        } else {
                            // No document selected
                            documentDisplayContainer.innerHTML = `
                                <div class="gradio-display-area">
                                    <p class="gradio-placeholder-text">Please select an OCR-ready document from the sidebar.</p>
                                </div>
                            `;
                        }
                    }
                    hideOCRControls();
                    clearSegmentData();
                }
            });
            pngSelect.setAttribute('data-listener-added', 'true');
            console.log('[setupPageSelectionListener] Page selection event listener attached');
        }
    }

    // AJAX function to load document pages
    function loadDocumentPages(documentName) {
        console.log('[loadDocumentPages] Loading pages for document:', documentName);
        
        // Show loading state
        const pageSelectionContainer = document.getElementById('page-selection-container');
        const pngSelect = document.getElementById('png-select');
        
        if (pageSelectionContainer) {
            pageSelectionContainer.style.display = 'block';
            setTimeout(() => pageSelectionContainer.classList.add('show'), 10);
        }
        
        if (pngSelect) {
            pngSelect.disabled = true;
            pngSelect.innerHTML = '<option value="">Loading pages...</option>';
        }
        
        // Make AJAX call to get document images
        const userId = '{{ session.get("user_id", "anonymous") }}';
        const apiUrl = `{{ url_for('app.api_get_document_images', user_id='__USER_ID__', document_folder_name='__DOCUMENT_NAME__') }}`
            .replace('__USER_ID__', encodeURIComponent(userId))
            .replace('__DOCUMENT_NAME__', encodeURIComponent(documentName));
        
        fetch(apiUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                return response.json();
            })
            .then(data => {
                console.log('[loadDocumentPages] Received data:', data);
                
                if (data.success && data.images && Array.isArray(data.images)) {
                    // Populate the dropdown
                    if (pngSelect) {
                        pngSelect.innerHTML = '<option value="">-- Select Page --</option>';
                        
                        data.images.forEach(image => {
                            const option = document.createElement('option');
                            option.value = image.filename;
                            
                            if (image.filename.includes('crop')) {
                                option.textContent = image.filename.split('.')[0]; // Show full name for crops
                            } else {
                                // Extract page number for regular pages
                                const pageMatch = image.filename.match(/page_(\d+)/);
                                if (pageMatch) {
                                    option.textContent = `Page ${parseInt(pageMatch[1])}`;
                                } else {
                                    option.textContent = image.filename;
                                }
                            }
                            
                            pngSelect.appendChild(option);
                        });
                        
                        pngSelect.disabled = false;
                        
                        // Re-setup event listener for the page selection dropdown
                        setupPageSelectionListener();
                    }
                    
                    // Update document info display
                    if (selectedDocumentInfo) {
                        selectedDocumentInfo.style.display = 'block';
                    }
                    
                    showAlert('success', `Loaded ${data.images.length} pages for ${documentName}`);
                    console.log('[loadDocumentPages] Successfully loaded', data.images.length, 'pages');
                } else {
                    throw new Error(data.error || 'Failed to load document pages');
                }
            })
            .catch(error => {
                console.error('[loadDocumentPages] Error:', error);
                
                if (pngSelect) {
                    pngSelect.innerHTML = '<option value="">Error loading pages</option>';
                    pngSelect.disabled = true;
                }
                
                // Show error message
                showAlert('error', `Failed to load document pages: ${error.message}`);
            });
    }

    // Function to load and display a page
    function loadPage(documentName, pageName) {
        console.log('[loadPage] Loading page:', { documentName, pageName });
        
        // Update browser URL without page reload
        updateBrowserURL(documentName, pageName);
        
        // Use a retry mechanism to find the document display container
        function tryLoadPage(retryCount = 0) {
            const maxRetries = 5;
            const documentDisplayContainer = document.getElementById('document-display-container');
            
            // Debug: Log what we found
            console.log(`[loadPage] Attempt ${retryCount + 1}/${maxRetries + 1} - Element check:`, {
                documentDisplayContainer: !!documentDisplayContainer,
                documentDisplayContainerDisplay: documentDisplayContainer ? documentDisplayContainer.style.display : 'N/A'
            });
            
            if (documentDisplayContainer) {
                console.log('[loadPage] Container found, proceeding with page load');
                
                const userId = '{{ session.get("user_id", "anonymous") }}';
                const imageUrl = `{{ url_for('app.serve_completed_document_png_file', 
                    user_id='__USER_ID__', 
                    document_folder_name='__FOLDER__', 
                    image_filename='__FILENAME__') }}`
                    .replace('__USER_ID__', encodeURIComponent(userId))
                    .replace('__FOLDER__', encodeURIComponent(documentName))
                    .replace('__FILENAME__', encodeURIComponent(pageName));
                
                // Update image preview area to show the selected page
                documentDisplayContainer.innerHTML = `
                 
                    <div class="gradio-display-area" style="min-height: 40vh; padding:0; border: none; background: #fff;">
                        <div id="image-container" style="position: relative; display: inline-block;">
                            <img id="preview-image"
                                src="${imageUrl}"
                                alt="Page Preview: ${pageName}"
                                onload="handleImageLoaded()"
                                onerror="handleImageError()">
                            <!-- Overlay canvas for bounding boxes -->
                            <canvas id="bounding-box-overlay" style="position: absolute; top: 0; left: 0; pointer-events: none; z-index: 10;"></canvas>
                        </div>
                    </div>
                `;
                
                // Show the document display container
                showDocumentDisplay();
                
                // Show the OCR controls in the right column
                showOCRControls(documentName, pageName);
                
                // Clear any existing segments and OCR results
                clearSegmentData();
                
                // Initialize canvas after image loads
                setTimeout(() => {
                    console.log('[loadPage] Initializing canvas for dynamically loaded image');
                    initializeBoundingBoxCanvas();
                }, 100); // Small delay to ensure DOM is updated
                
                // Load and display segments coordinates in debug info
                setTimeout(() => {
                    loadAndDisplaySegmentsCoordinates(documentName, pageName);
                }, 200); // Small delay to ensure image is loaded
                
                // Check for existing segments for this page (after OCR controls are ready)
                const pageId = pageName.split('.')[0];
                
                // Use a more robust retry mechanism
                function waitForElementsAndCheckSegments(retryCount = 0) {
                    const maxRetries = 10; // Maximum 10 attempts
                    const lineSegmentsContainer = document.getElementById('line-segments-container');
                    const selectedLineImageEl = document.getElementById('sidebar-segment-image');
                    const selectedLineTextEl = document.getElementById('sidebar-segment-text');
                    
                    if (lineSegmentsContainer && selectedLineImageEl && selectedLineTextEl) {
                        console.log('[loadPage] Required elements found, checking for existing segments');
                        checkForExistingSegments(documentName, pageId);
                    } else if (retryCount < maxRetries) {
                        console.warn(`[loadPage] Required elements not ready (attempt ${retryCount + 1}/${maxRetries}), retrying in 100ms`);
                        setTimeout(() => waitForElementsAndCheckSegments(retryCount + 1), 100);
                    } else {
                        console.error('[loadPage] Failed to find required elements after maximum retries');
                    }
                }
                
                // Start the retry mechanism
                setTimeout(() => waitForElementsAndCheckSegments(), 50);
                
                showAlert('info', `Loaded page: ${pageName}`);
                console.log('[loadPage] Page loaded successfully');
                
            } else if (retryCount < maxRetries) {
                console.warn(`[loadPage] Document display container not found, retrying in 50ms (attempt ${retryCount + 1}/${maxRetries + 1})`);
                setTimeout(() => tryLoadPage(retryCount + 1), 50);
            } else {
                console.error('[loadPage] Document display container not found after maximum retries');
                showAlert('error', 'Failed to load page: Document display container not found');
            }
        }
        
        // Start the load attempt
        tryLoadPage();
    }

    // Function to hide OCR controls when no page is selected
    function hideOCRControls() {
        const rightColumn = document.querySelector('.main-right-column');
        if (rightColumn) {
            rightColumn.innerHTML = `
                <div class="gradio-component-group" style="background-color: #f9fafb; padding: 1rem;">
                    <p class="gradio-placeholder-text">Select a document and page to access OCR controls.</p>
                </div>
            `;
        }
    }

    // Function to setup event listeners for OCR controls
    function setupOCRControlEventListeners() {
        // Setup segment dropdown event listener
        const segmentSelect = document.getElementById('segment-select');
        if (segmentSelect && !segmentSelect.hasAttribute('data-listener-added')) {
            segmentSelect.addEventListener('change', handleSegmentSelection);
            segmentSelect.setAttribute('data-listener-added', 'true');
        }
        
        // Setup Alt+Enter functionality for segment text area
        setupSegmentTextAreaEventListeners();
        
        // Setup prev/next button event listeners
        const prevBtn = document.getElementById('prev-segment-btn');
        const nextBtn = document.getElementById('next-segment-btn');
        if (prevBtn) {
            prevBtn.onclick = function() {
                if (currentSegmentDisplayIndex > 0) {
                    displaySegmentByIndex(currentSegmentDisplayIndex - 1);
                }
            };
        }
        if (nextBtn) {
            nextBtn.onclick = function() {
                if (currentSegmentDisplayIndex < currentSegmentsList.length - 1) {
                    displaySegmentByIndex(currentSegmentDisplayIndex + 1);
                }
            };
        }
        
        // Setup JSON viewer event listeners
        const viewJsonBtn = document.getElementById('view-segment-json-btn');
        const closeJsonBtn = document.getElementById('close-segment-json-btn');
        if (viewJsonBtn) {
            viewJsonBtn.onclick = function() {
                toggleSegmentJson(true);
            };
        }
        if (closeJsonBtn) {
            closeJsonBtn.onclick = function() {
                toggleSegmentJson(false);
            };
        }
    }

    // Function to setup Alt+Enter functionality for segment text area
    function setupSegmentTextAreaEventListeners() {
        const segmentTextArea = document.getElementById('sidebar-segment-text');
        if (segmentTextArea && !segmentTextArea.hasAttribute('data-alt-enter-listener-added')) {
            let originalText = '';
            let hasUnsavedChanges = false;

            // Track changes to show unsaved indicator
            segmentTextArea.addEventListener('input', function() {
                const saveHint = document.getElementById('save-hint');
                if (this.value !== originalText) {
                    if (!hasUnsavedChanges) {
                        hasUnsavedChanges = true;
                        this.style.borderColor = '#ffc107';
                        if (saveHint) {
                            saveHint.style.color = '#ffc107';
                            saveHint.textContent = 'Alt+Enter to save (unsaved changes)';
                        }
                    }
                } else {
                    hasUnsavedChanges = false;
                    this.style.borderColor = '#ddd';
                    if (saveHint) {
                        saveHint.style.color = '#28a745';
                        saveHint.textContent = 'Alt+Enter to save';
                    }
                }
            });

            // Store original text when segment is loaded
            window.setOriginalSegmentText = function(text) {
                originalText = text;
                hasUnsavedChanges = false;
                const textArea = document.getElementById('sidebar-segment-text');
                if (textArea) {
                    textArea.style.borderColor = '#ddd';
                }
                const saveHint = document.getElementById('save-hint');
                if (saveHint) {
                    saveHint.style.color = '#28a745';
                    saveHint.textContent = 'Alt+Enter to save';
                }
            };

            segmentTextArea.addEventListener('keydown', function(event) {
                if (event.altKey && event.key === 'Enter') {
                    event.preventDefault();
                    saveFinalSegmentText();
                }
            });

            // Mark that we've added the event listener to prevent duplicates
            segmentTextArea.setAttribute('data-alt-enter-listener-added', 'true');
            console.log('[setupSegmentTextAreaEventListeners] Alt+Enter functionality setup complete');
        }
    }

    // UI helper functions
    function showPageSelection() {
        if (pageSelectionContainer) {
            pageSelectionContainer.style.display = 'block';
            setTimeout(() => pageSelectionContainer.classList.add('show'), 10);
        }
    }
    
    function hidePageSelection() {
        if (pageSelectionContainer) {
            pageSelectionContainer.classList.remove('show');

    // Helper function to show alerts/notifications
    function showAlert(type, message, duration = 5000) {
        console.log(`[${type.toUpperCase()}]`, message);
        
        // Create notification element
        const notification = document.createElement('div');
        notification.className = `notification notification-${type}`;
        
        const icon = getNotificationIcon(type);
        const messageText = document.createElement('span');
        messageText.textContent = message;
        
        const closeButton = document.createElement('button');
        closeButton.className = 'notification-close';
        closeButton.innerHTML = '×';
        closeButton.onclick = () => removeNotification(notification);
        
        notification.appendChild(icon);
        notification.appendChild(messageText);
        notification.appendChild(closeButton);
        
        // Add to container
        const container = document.getElementById('notification-container');
        if (container) {
            container.appendChild(notification);
            
            // Trigger animation
            setTimeout(() => notification.classList.add('show'), 10);
            
            // Auto-remove after duration
            if (duration > 0) {
                setTimeout(() => removeNotification(notification), duration);
            }
        } else {
            // Fallback to console/alert if container doesn't exist
            if (type === 'error') {
                alert(`Error: ${message}`);
            } else {
                console.log(`${type}: ${message}`);
            }
        }
    }
    
    function getNotificationIcon(type) {
        const icon = document.createElement('span');
        icon.style.fontSize = '16px';
        
        switch (type) {
            case 'success':
                icon.innerHTML = '✓';
                break;
            case 'error':
                icon.innerHTML = '✕';
                break;
            case 'info':
                icon.innerHTML = 'ℹ';
                break;
            default:
                icon.innerHTML = '•';
        }
        
        return icon;
    }
    
    function removeNotification(notification) {
        if (notification && notification.parentNode) {
            notification.classList.remove('show');
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.parentNode.removeChild(notification);
                }
            }, 300);
        }
    }

    // Function to load user documents via AJAX
    function loadUserDocuments() {
        console.log('[loadUserDocuments] Loading user documents via AJAX');
        
        const sidebarLoading = document.getElementById('sidebar-loading');
        const documentsList = document.getElementById('sidebar-documents-list');
        
        // Show loading state
        if (sidebarLoading) {
            sidebarLoading.style.display = 'block';
        }
        
        const userId = '{{ session.get("user_id", "anonymous") }}';
        const apiUrl = `{{ url_for('app.api_get_user_documents', user_id='__USER_ID__') }}`
            .replace('__USER_ID__', encodeURIComponent(userId));
        
        fetch(apiUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                return response.json();
            })
            .then(data => {
                console.log('[loadUserDocuments] Received data:', data);
                
                // Hide loading state
                if (sidebarLoading) {
                    sidebarLoading.style.display = 'none';
                }
                
                if (data.success && data.documents && Array.isArray(data.documents)) {
                    // Clear existing content
                    if (documentsList) {
                        documentsList.innerHTML = '';
                    }
                    
                    if (data.documents.length > 0) {
                        // Populate with documents
                        data.documents.forEach(doc => {
                            if (doc.is_completed) { // Only show OCR-ready documents
                                const documentItem = createDocumentItem(doc);
                                if (documentsList) {
                                    documentsList.appendChild(documentItem);
                                }
                            }
                        });
                        
                        // Re-setup event listeners
                        setupSidebarDocumentSelection();
                    } else {
                        // Show no documents message
                        if (documentsList) {
                            documentsList.innerHTML = `
                                <div style="text-align: center; padding: 1rem; color: #666; font-size: 0.875rem;">
                                    <p>No OCR-ready documents found.</p>
                                    <p style="margin-top: 0.5rem; font-size: 0.8em;">Documents become OCR-ready after using the "Move to OCR" button in the Image Cropping Tool.</p>
                                    <button onclick="navigateToEdit()" class="gradio-button gradio-button-primary" style="display: inline-block; margin-top: 0.5rem; font-size: 0.75rem; padding: 0.5rem 0.75rem; border: none; cursor: pointer;">Go to Image Cropping Tool</button>
                                </div>
                            `;
                        }
                    }
                } else {
                    throw new Error(data.error || 'Failed to load user documents');
                }
            })
            .catch(error => {
                console.error('[loadUserDocuments] Error:', error);
                
                // Hide loading state
                if (sidebarLoading) {
                    sidebarLoading.style.display = 'none';
                }
                
                // Show error message
                if (documentsList) {
                    documentsList.innerHTML = `
                        <div style="text-align: center; padding: 1rem; color: #dc2626; font-size: 0.875rem;">
                            <p>Error loading documents: ${error.message}</p>
                            <button onclick="loadUserDocuments()" class="gradio-button gradio-button-secondary" style="margin-top: 0.5rem; font-size: 0.75rem; padding: 0.5rem 0.75rem;">Retry</button>
                        </div>
                    `;
                }
            });
    }

                lineSegmentsContainer: !!lineSegmentsContainer,
                selectedLineImageEl: !!selectedLineImageEl,
                selectedLineTextEl: !!selectedLineTextEl

    function fetchSegmentJson() {
        const loadingEl = document.getElementById('segment-json-loading');
        const contentEl = document.getElementById('segment-json-content');
        
        if (!loadingEl || !contentEl) {
            console.error('[fetchSegmentJson] Required elements not found');
            return;
        }
        
        // Debug logging
        console.log('[fetchSegmentJson] Current state:', {
            index: currentSegmentDisplayIndex,
            listLength: currentSegmentsList?.length,
            folder: currentSegmentFolderGlobal,
            pageId: currentSegmentPageIdGlobal
        });

        // Validate segment index
        if (currentSegmentDisplayIndex < 0 || !currentSegmentsList || currentSegmentDisplayIndex >= currentSegmentsList.length) {
            const error = 'No segment is currently selected or invalid segment index.';
            console.error('[fetchSegmentJson]', error);
            contentEl.textContent = `Error: ${error}`;
            loadingEl.style.display = 'none';
            contentEl.style.display = 'block';
            return;
        }
        
        // Get current segment
        const segment = currentSegmentsList[currentSegmentDisplayIndex];
        
        // Debug logging
        console.log('[fetchSegmentJson] Selected segment:', segment);

        // Validate segment object
        if (!segment) {
            const error = 'Selected segment data is null or undefined.';
            console.error('[fetchSegmentJson]', error);
            contentEl.textContent = `Error: ${error}`;
            loadingEl.style.display = 'none';
            contentEl.style.display = 'block';
            return;
        }

        // Get segment ID (handle both string and number types)
        const segmentId = segment.id !== undefined ? String(segment.id) : 
                            currentSegmentDisplayIndex.toString().padStart(3, '0');
        
        if (!segmentId) {
            const error = 'Unable to determine segment ID.';
            console.error('[fetchSegmentJson]', error);
            contentEl.textContent = `Error: ${error}`;
            loadingEl.style.display = 'none';
            contentEl.style.display = 'block';
            return;
        }

        const userId = '{{ session.get("user_id", "anonymous") }}';
        const folder = currentSegmentFolderGlobal;
        const pageId = currentSegmentPageIdGlobal;
        
        if (!userId || !folder || !pageId) {
            const error = 'Missing required information to fetch JSON data.';
            console.error('[fetchSegmentJson]', error, { userId, folder, pageId });
            contentEl.textContent = `Error: ${error}`;
            loadingEl.style.display = 'none';
            contentEl.style.display = 'block';
            return;
        }
        
        // Construct URL with proper encoding using url_for pattern
        const jsonUrl = `{{ url_for('app.get_segment_json', user_id='__USER_ID__', document_folder_name='__FOLDER__', page_image_filename_base='__PAGE_ID__', segment_id_str='__SEGMENT_ID__') }}`
            .replace('__USER_ID__', encodeURIComponent(userId))
            .replace('__FOLDER__', encodeURIComponent(folder))
            .replace('__PAGE_ID__', encodeURIComponent(pageId))
            .replace('__SEGMENT_ID__', encodeURIComponent(segmentId));
        
        console.log('[fetchSegmentJson] Fetching JSON from:', jsonUrl);
        
        // Show loading state
        loadingEl.style.display = 'block';
        contentEl.style.display = 'none';
        
        fetch(jsonUrl)
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => {
                        throw new Error(`Server error ${response.status}: ${text}`);
                    });
                }
                return response.json();
            })
            .then(data => {
                // Format JSON with indentation for readability
                contentEl.textContent = JSON.stringify(data, null, 2);
                loadingEl.style.display = 'none';
                contentEl.style.display = 'block';
            })
            .catch(error => {
                console.error('[fetchSegmentJson] Error:', error);
                contentEl.textContent = `Error loading JSON: ${error.message}`;
                loadingEl.style.display = 'none';
                contentEl.style.display = 'block';
            });
    }

        if (index >= 0 && index < currentSegmentsList.length) {

                segmentCounter.textContent = `Segment ${index + 1} of ${currentSegmentsList.length}`;

                // Construct segment image URL
                const segmentId = segment.id !== undefined ? String(segment.id) : 
                                index.toString().padStart(3, '0');
        
                const imageUrl = `{{ url_for('app.get_segment_image', user_id='__USER_ID__', document_folder_name='__FOLDER__', page_image_filename_base='__PAGE_ID__', segment_id_str='__SEGMENT_ID__') }}`

                    .replace('__FOLDER__', encodeURIComponent(currentSegmentFolderGlobal))

                    isSegmentFinal = true;

                    if (typeof segment.text === 'string') {

                textEl.value = displayText;

                previewContainer.style.display = 'block';

            if (previewContainer) {

            }

    // Update the loadLineSegments function
    function loadLineSegments(folder, pageId) {
        const lineSegmentsContainer = document.getElementById('line-segments-container');
        const selectedLineImageEl = document.getElementById('sidebar-segment-image');
        const selectedLineTextEl = document.getElementById('sidebar-segment-text');
        const segmentCounter = document.getElementById('segment-counter');
        
        console.log('[loadLineSegments] Element check:', {
            lineSegmentsContainer: !!lineSegmentsContainer,
            selectedLineImageEl: !!selectedLineImageEl,
            selectedLineTextEl: !!selectedLineTextEl,
            segmentCounter: !!segmentCounter
        });
        
        if (!lineSegmentsContainer) {
            console.error("[loadLineSegments] Missing element: line-segments-container");
            return Promise.reject(new Error("Missing element: line-segments-container"));
        }
        if (!selectedLineImageEl) {
            console.error("[loadLineSegments] Missing element: sidebar-segment-image");
            return Promise.reject(new Error("Missing element: sidebar-segment-image"));
        }
        if (!selectedLineTextEl) {
            console.error("[loadLineSegments] Missing element: sidebar-segment-text");
            return Promise.reject(new Error("Missing element: sidebar-segment-text"));
        }

        if (selectedLineImageEl.tagName === 'IMG') {
            selectedLineImageEl.src = '';
            selectedLineImageEl.alt = 'Loading...';
        }
        selectedLineTextEl.textContent = '';
        if (segmentCounter) segmentCounter.textContent = 'Loading segments...';
        
        lineSegmentsContainer.style.display = 'block';
        currentSegmentsList = [];
        currentSegmentDisplayIndex = -1;
        currentSegmentFolderGlobal = folder;
        currentSegmentPageIdGlobal = pageId;
        updateNavigationButtons();

        const segmentsUrl = `{{ url_for('app.get_segments', user_id='USERID', document_folder_name='FOLDER', page_image_filename_base='PAGEID') }}`
            .replace('USERID', '{{ session.get("user_id", "anonymous") }}')
            .replace('FOLDER', encodeURIComponent(folder))
            .replace('PAGEID', encodeURIComponent(pageId));
        
        // Return the fetch promise chain
        return fetch(segmentsUrl)
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => {
                        throw new Error(`Failed to load segments: ${response.status}. ${text}`);
                    });
                }
                return response.json();
            })
            .then(data => {
                if (data && data.success === true && data.segments && Array.isArray(data.segments) && data.segments.length > 0) {
                    currentSegmentsList = data.segments;
                    
                    // Update OCR result div with all segment text (with highlighting for final segments)
                    const ocrResult = document.getElementById('ocr-result');
                    if (ocrResult) {
                        const htmlLines = [];
                        
                        data.segments.forEach((segment, index) => {
                            if (segment.text) {
                                let segmentText = '';
                                let isFinal = false;
                                
                                // Use final text if available, otherwise use original text
                                if (segment.is_final && segment.final_text) {
                                    segmentText = segment.final_text;
                                    isFinal = true;
                                } else if (typeof segment.text === 'string') {
                                    segmentText = segment.text;
                                } else if (Array.isArray(segment.text) && segment.text.length > 0) {
                                    segmentText = String(segment.text[0]);

    // Segment & OCR functionality
    function performSegmentOCR() {
        if (!currentFolder || !currentPage) {
            showSegmentOCRStatus('error', 'No page selected for OCR processing');
            return;
        }

        showSegmentOCRLoading(true);
        hideSegmentOCRStatus();

        // Get the image URL for the current page
        const imageUrl = `{{ url_for('app.serve_completed_document_png_file', 
            user_id='__USER_ID__', 
            document_folder_name='__FOLDER__', 
            image_filename='__FILENAME__') }}`
            .replace('__USER_ID__', encodeURIComponent("{{ session.get('user_id', 'anonymous') }}"))
            .replace('__FOLDER__', encodeURIComponent(currentFolder))
            .replace('__FILENAME__', encodeURIComponent(currentPage));

        // Call the Flask OCR processing endpoint
        const ocrData = {
            folder: currentFolder,
            filename: currentPage
        };
        
        fetch('/process_ocr', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(ocrData)
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                return response.json();
            })
            .then(data => {
                showSegmentOCRLoading(false);
                
                if (data.success) {
                    showSegmentOCRStatus('success', 'OCR processing completed successfully!');
                    showAlert('success', 'OCR processing completed successfully!');
                    
                    // Collect all text lines from segments and concatenate with highlighting for final segments
                    const ocrResult = document.getElementById('ocr-result');
                    if (ocrResult) {
                        let htmlContent = '';
                        
                        // First try to get text from data.segments if available
                        if (data.segments && Array.isArray(data.segments) && data.segments.length > 0) {
                            const htmlLines = [];
                            
                            data.segments.forEach((segment, index) => {
                                if (segment.text) {
                                    let segmentText = '';
                                    let isFinal = segment.is_final && segment.final_text;
                                    
                                    if (isFinal) {
                                        segmentText = segment.final_text;
                                    } else if (typeof segment.text === 'string') {
                                        segmentText = segment.text;
                                    } else if (Array.isArray(segment.text) && segment.text.length > 0) {
                                        // If text is an array [text, confidence], take the first element
                                        segmentText = String(segment.text[0]);
                                    } else {
                                        // Fallback: convert to string
                                        segmentText = String(segment.text);
                                    }
                                    
                                    // Clean and add the text if not empty
                                    segmentText = segmentText.trim();
                                    if (segmentText) {
                                        // Escape HTML to prevent XSS
                                        const escapedText = segmentText.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                                        
                                        if (isFinal) {
                                            htmlLines.push(`<span class="ocr-final-line">★ ${escapedText} [FINAL]</span>`);
                                        } else {
                                            htmlLines.push(escapedText);
                                        }
                                    }
                                }
                            });
                            
                            // Join all text lines with line breaks
                            htmlContent = htmlLines.join('<br>');
                        }
                        
                        // Fallback to data.text if no segments text was found
                        if (!htmlContent && data.text) {
                            // Escape HTML for fallback text as well
                            htmlContent = data.text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
                        }
                        
                        // Set the HTML content in the div
                        ocrResult.innerHTML = htmlContent;
                    }
                    
                    // Populate the segment dropdown with the new segments
                    if (data.segments && data.segments.length > 0) {
                        populateSegmentDropdown(data.segments);
                        showSegmentStatus(`Found ${data.segments.length} segments`);
                    } else {
                        populateSegmentDropdown([]);
                        showSegmentStatus('No segments detected');
                    }
                    
                    // Also reload segments to show in the navigation
                    if (currentFolder && currentPage) {
                        const pageId = currentPage.split('.')[0];
                        setTimeout(() => {
                            checkForExistingSegments(currentFolder, pageId);
                        }, 1000);
                    }
                } else {
                    showSegmentOCRStatus('error', data.error || data.message || 'Failed to process image with OCR');
                }
            })
            .catch(error => {
                console.error('Segment OCR error:', error);
                showSegmentOCRLoading(false);
                showSegmentOCRStatus('error', `Network error: ${error.message}`);
            });
    }

    // Function to initialize the bounding box canvas
    function initializeBoundingBoxCanvas() {
        console.log('[DEBUG] Initializing bounding box canvas...');
        const previewImage = document.getElementById('preview-image');
        const canvas = document.getElementById('bounding-box-overlay');
        
        console.log('[DEBUG] Elements found:', { previewImage: !!previewImage, canvas: !!canvas });
        
        if (!previewImage || !canvas) {
            console.error('[DEBUG] Missing elements for bounding box canvas');
            return false;
        }
        
        function resizeCanvas() {
            // Set canvas size to match image display size exactly
            const imageDisplayWidth = previewImage.offsetWidth;
            const imageDisplayHeight = previewImage.offsetHeight;
            
            // Set canvas internal dimensions (affects coordinate system)
            canvas.width = imageDisplayWidth;
            canvas.height = imageDisplayHeight;
            
            // Set canvas display size (affects visual size)
            canvas.style.width = imageDisplayWidth + 'px';
            canvas.style.height = imageDisplayHeight + 'px';
            
            console.log('[DEBUG] Canvas resized to match image:', {
                canvasInternalSize: { width: canvas.width, height: canvas.height },
                canvasDisplaySize: { width: canvas.style.width, height: canvas.style.height },
                imageDisplaySize: { width: imageDisplayWidth, height: imageDisplayHeight },
                imageNaturalSize: { width: previewImage.naturalWidth, height: previewImage.naturalHeight }
            });
            
            // Clear any existing drawings when resizing
            const ctx = canvas.getContext('2d');
            if (ctx) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }
        
        // Wait for image to load to get correct dimensions
        if (previewImage.complete && previewImage.naturalWidth > 0) {
            console.log('[DEBUG] Image already loaded, resizing canvas immediately');
            resizeCanvas();
        } else {
            console.log('[DEBUG] Waiting for image to load...');
            previewImage.onload = function() {
                console.log('[DEBUG] Image loaded, now resizing canvas');
                resizeCanvas();
            };
            
            // Fallback: try to resize after a delay even if onload doesn't fire
            setTimeout(() => {
                if (previewImage.naturalWidth > 0) {
                    console.log('[DEBUG] Image loaded (fallback), resizing canvas');
                    resizeCanvas();
                }
            }, 500);
        }
        
        // Resize canvas when window resizes
        window.addEventListener('resize', resizeCanvas);
        return true;
    }
    
    // Function to draw bounding box for a segment
    function drawSegmentBoundingBox(segment) {
        console.log('[DEBUG] Drawing bounding box for segment:', segment);
        const canvas = document.getElementById('bounding-box-overlay');
        const previewImage = document.getElementById('preview-image');
        
        if (!canvas || !previewImage) {
            console.error('[DEBUG] Missing canvas or preview image');
            return;
        }
        
        if (!segment.bbox) {
            console.warn('[DEBUG] Segment has no bbox:', segment);
            return;
        }
        
        const ctx = canvas.getContext('2d');
        
        if (!ctx) {
            console.error('[DEBUG] Could not get canvas 2D context');
            return;
        }
        
        // Clear previous drawings
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Calculate scale factors to convert from original coords to display coords
        const imageDisplayWidth = previewImage.offsetWidth;
        const imageDisplayHeight = previewImage.offsetHeight;
        const imageActualWidth = previewImage.naturalWidth;
        const imageActualHeight = previewImage.naturalHeight;
        const scaleX = imageDisplayWidth / imageActualWidth;
        const scaleY = imageDisplayHeight / imageActualHeight;
        
        // Extract bounding box coordinates
        let x, y, width, height;
        
        if (Array.isArray(segment.bbox) && segment.bbox.length === 4) {
            const [x1_original, y1_original, x2_original, y2_original] = segment.bbox;
            
            // Scale to display coordinates
            const x1_display = x1_original * scaleX;
            const y1_display = y1_original * scaleY;
            const x2_display = x2_original * scaleX;
            const y2_display = y2_original * scaleY;
            
            // Calculate final rectangle coordinates
            x = Math.min(x1_display, x2_display);
            y = Math.min(y1_display, y2_display);
            width = Math.abs(x2_display - x1_display);
            height = Math.abs(y2_display - y1_display);
            
        } else if (typeof segment.bbox === 'object' && segment.bbox.x !== undefined) {
            // Format: {x, y, width, height} object in original coordinates
            x = segment.bbox.x * scaleX;
            y = segment.bbox.y * scaleY;
            width = segment.bbox.width * scaleX;
            height = segment.bbox.height * scaleY;
        } else {
            console.warn('[DEBUG] Unsupported bbox format:', segment.bbox);
            return;
        }
        
        // Validate coordinates
        if (x < 0 || y < 0 || width <= 0 || height <= 0) {
            console.warn('[DEBUG] Invalid coordinates calculated:', { x, y, width, height });
            return;
        }
        
        // Draw red bounding box
        ctx.strokeStyle = '#dc2626';
        ctx.lineWidth = 3;
        ctx.setLineDash([]);
        ctx.strokeRect(x, y, width, height);
        
        // Add semi-transparent fill
        ctx.fillStyle = 'rgba(220, 38, 38, 0.1)';
        ctx.fillRect(x, y, width, height);
        
        console.log('[DEBUG] Successfully drew bounding box');
        
        // Mark that canvas has been drawn to
        canvas.setAttribute('data-has-drawing', 'true');
    }
    
    // Function to clear all bounding boxes
    function clearBoundingBoxes() {

            canvas.removeAttribute('data-has-drawing');
            console.log('[DEBUG] Cleared bounding boxes');
        } else {
            console.log('[DEBUG] No canvas found to clear');
        }
    }

                        const remainingDocs = document.querySelectorAll('.document-item').length;
                        if (remainingDocs === 0) {
                            const documentsList = document.getElementById('sidebar-documents-list');
                            documentsList.innerHTML = `
                                <div style="text-align: center; padding: 1rem; color: #666; font-size: 0.875rem;">
                                    <p>No OCR-ready documents found.</p>
                                    <p style="margin-top: 0.5rem; font-size: 0.8em;">Documents become OCR-ready after using the "Move to OCR" button in the Image Cropping Tool.</p>
                                    <button onclick="navigateToEdit()" class="gradio-button gradio-button-primary" style="display: inline-block; margin-top: 0.5rem; font-size: 0.75rem; padding: 0.5rem 0.75rem; border: none; cursor: pointer;">Go to Image Cropping Tool</button>
                                </div>
                            `;
                        }
                    }, 300);
                }
            } else {
                showSidebarAlert('error', data.message || 'Failed to delete document');
            }
        })
        .catch(error => {
            console.error('Error deleting document:', error);
            showSidebarAlert('error', 'Network error occurred while deleting document');
        });
    }
    
    // Function to show sidebar alerts
    function showSidebarAlert(type, message) {
        const sidebarAlertArea = document.getElementById('sidebar-alert-area');
        if (!sidebarAlertArea) {
            console.warn('Sidebar alert area not found');
            return;
        }
        
        let alertClass = 'sidebar-alert-error';
        if (type === 'success') {
            alertClass = 'sidebar-alert-success';
        } else if (type === 'processing') {
            alertClass = 'sidebar-alert-success';
        }
        
        sidebarAlertArea.innerHTML = `
            <div class="sidebar-alert ${alertClass}">
                ${type === 'processing' ? '<span class="loading-spinner"></span>' : ''}
                ${message}
            </div>
        `;
        
        // Auto-hide success and processing alerts
        if (type === 'success') {
            setTimeout(() => {
                sidebarAlertArea.innerHTML = '';
            }, 5000);
        } else if (type === 'processing') {
            // Processing alerts are hidden when the operation completes
        }
    }
    
    // Function to navigate to edit page
    function navigateToEdit() {
        window.location.href = "{{ url_for('app.crop_image') }}";
    }
    
    // Function to load and display segments coordinates in debug info
    function loadAndDisplaySegmentsCoordinates(documentName, pageName) {
        console.log('[DEBUG] Loading segments coordinates for:', { documentName, pageName });
        
        const debugPathInfo = document.getElementById('debug-path-info');
        if (!debugPathInfo) {
            console.warn('[DEBUG] Debug path info element not found');
            return;
        }
        
        // Extract base filename (remove .png extension)
        const pageImageFilenameBase = pageName.split('.')[0];
        const userId = '{{ session.get("user_id", "anonymous") }}';
        
        // Make API call to get segments data
        const segmentsUrl = `{{ url_for('app.get_segments', user_id='__USER_ID__', document_folder_name='__DOCUMENT_NAME__', page_image_filename_base='__PAGE_BASE__') }}`
            .replace('__USER_ID__', encodeURIComponent(userId))
            .replace('__DOCUMENT_NAME__', encodeURIComponent(documentName))
            .replace('__PAGE_BASE__', encodeURIComponent(pageImageFilenameBase));
        
        fetch(segmentsUrl)
            .then(response => response.json())
            .then(data => {
                console.log('[DEBUG] Segments data received:', data);
                
                // Find or create the segments coordinates section
                let segmentsSection = debugPathInfo.querySelector('.segments-coordinates-section');
                if (!segmentsSection) {
                    segmentsSection = document.createElement('div');
                    segmentsSection.className = 'segments-coordinates-section';
                    debugPathInfo.appendChild(segmentsSection);
                }
                
                if (data.success && data.segments && data.segments.length > 0) {
                    let segmentsHtml = '<br><strong>Segments Coordinates:</strong>';
                    segmentsHtml += '<div style="font-family: monospace; font-size: 12px; max-height: 150px; overflow-y: auto; margin-top: 5px; padding: 5px; background-color: #f9f9f9; border: 1px solid #ccc;">';
                    
                    data.segments.forEach(segment => {
                        segmentsHtml += '<div style="margin-bottom: 3px;">';
                        segmentsHtml += `<span style="color: #666;">Segment ${segment.id}:</span> `;
                        
                        if (segment.bbox && segment.bbox.length >= 4) {
                            segmentsHtml += `<span style="color: #2563eb;">bbox=[${segment.bbox[0]}, ${segment.bbox[1]}, ${segment.bbox[2]}, ${segment.bbox[3]}]</span>`;
                            if (segment.confidence) {
                                segmentsHtml += ` <span style="color: #16a34a;">conf=${segment.confidence.toFixed(2)}</span>`;
                            }
                        } else {
                            segmentsHtml += '<span style="color: #dc2626;">No coordinates</span>';
                        }
                        
                        segmentsHtml += '</div>';
                    });
                    
                    segmentsHtml += '</div>';
                    //segmentsSection.innerHTML = segmentsHtml;
                } else {
                    //segmentsSection.innerHTML = '<br><strong>Segments Coordinates:</strong> <span style="color: #666; font-style: italic;">No segment data available</span>';
                }
            })
            .catch(error => {
                console.error('[DEBUG] Error loading segments coordinates:', error);
                let segmentsSection = debugPathInfo.querySelector('.segments-coordinates-section');
                if (!segmentsSection) {
                    segmentsSection = document.createElement('div');
                    segmentsSection.className = 'segments-coordinates-section';
                    debugPathInfo.appendChild(segmentsSection);
                }
                //segmentsSection.innerHTML = '<br><strong>Segments Coordinates:</strong> <span style="color: #dc2626; font-style: italic;">Error loading segments</span>';
            });
    }
    
    // Handle image load success
    function handleImageLoaded() {
        console.log('[DEBUG] Image loaded successfully');
        // Initialize canvas after image loads
        setTimeout(() => {
            initializeBoundingBoxCanvas();
        }, 100);
    }
    
    // Handle image load error
    function handleImageError() {
        console.error('[DEBUG] Image failed to load');
        const img = document.getElementById('preview-image');
        if (img) {
            console.error('[DEBUG] Image src:', img.src);
        }
    }
    
    // Close modal when clicking outside
    document.addEventListener('DOMContentLoaded', function() {
        const modal = document.getElementById('delete-confirmation-modal');
        if (modal) {
            modal.addEventListener('click', function(e) {
                if (e.target === this) {
                    closeDeleteConfirmationModal();
                }
            });
        }

        // Setup Alt+Enter functionality for initially loaded segment text area
        setupSegmentTextAreaEventListeners();
    });

    // Function to load final segment text if it exists
    function loadFinalSegmentText(segmentId, originalText, textEl, titleEl) {
        const pageImageFilenameBase = currentPage.replace('.png', '');
        
        // Construct API URL to get final text
        const apiUrl = '/api/get_final_segment_text?' + new URLSearchParams({
            user_id: userId,
            document_folder: currentSegmentFolderGlobal,
            page_image_filename_base: pageImageFilenameBase,
            segment_id_str: segmentId
        });
        
        fetch(apiUrl)
            .then(response => response.json())
            .then(data => {
                if (data.success && data.has_final) {
                    // Use final text instead of original
                    textEl.value = data.final_text;
                    
                    // Update title to indicate this segment has been edited
                    if (data.is_different) {
                        const segmentNumber = currentSegmentDisplayIndex + 1;
                        titleEl.textContent = `Preview of Segment ${segmentNumber} ✏️ (Edited)`;
                        titleEl.style.color = '#28a745';
                        
                        // Add visual indicator to the textarea
                        textEl.style.backgroundColor = '#f8fff8';
                        textEl.style.borderLeftColor = '#28a745';
                        textEl.style.borderLeftWidth = '3px';
                    } else {
                        // Final file exists but content is same as original
                        const segmentNumber = currentSegmentDisplayIndex + 1;
                        titleEl.textContent = `Preview of Segment ${segmentNumber}`;
                        titleEl.style.color = '';
                        textEl.style.backgroundColor = '';
                        textEl.style.borderLeftColor = '';
                        textEl.style.borderLeftWidth = '';
                    }
                    
                    // Set original text for change tracking (use final text as the baseline)
                    if (typeof window.setOriginalSegmentText === 'function') {
                        window.setOriginalSegmentText(data.final_text);
                    }
                    
                    console.log('[loadFinalSegmentText] Loaded final text for segment:', segmentId, {
                        hasFinal: data.has_final,
                        isDifferent: data.is_different,
                        finalText: data.final_text.substring(0, 50) + '...'
                    });
                } else {
                    // No final file exists, use original text
                    textEl.value = originalText;
                    
                    // Reset title styling
                    const segmentNumber = currentSegmentDisplayIndex + 1;
                    titleEl.textContent = `Preview of Segment ${segmentNumber}`;
                    titleEl.style.color = '';
                    textEl.style.backgroundColor = '';
                    textEl.style.borderLeftColor = '';
                    textEl.style.borderLeftWidth = '';
                    
                    // Set original text for change tracking
                    if (typeof window.setOriginalSegmentText === 'function') {
                        window.setOriginalSegmentText(originalText);
                    }
                    
                    console.log('[loadFinalSegmentText] No final text for segment:', segmentId, 'using original');
                }
            })
            .catch(error => {
                console.error('[loadFinalSegmentText] Error loading final text:', error);
                // Fall back to original text
                textEl.value = originalText;
                
                // Reset title styling
                const segmentNumber = currentSegmentDisplayIndex + 1;
                titleEl.textContent = `Preview of Segment ${segmentNumber}`;
                titleEl.style.color = '';
                textEl.style.backgroundColor = '';
                textEl.style.borderLeftColor = '';
                textEl.style.borderLeftWidth = '';
                
                // Set original text for change tracking
                if (typeof window.setOriginalSegmentText === 'function') {
                    window.setOriginalSegmentText(originalText);
                }
            });
    }

    // Function to save the final segment text
    function saveFinalSegmentText() {
        const segmentTextArea = document.getElementById('sidebar-segment-text');
        if (!segmentTextArea) {
            console.error('Segment text area not found');
            showAlert('error', 'Cannot save: text area not found');
            return;
        }

        // Check if we have a valid segment selected
        if (currentSegmentDisplayIndex < 0 || currentSegmentDisplayIndex >= currentSegmentsList.length) {
            console.error('No valid segment selected');
            showAlert('error', 'Please select a segment first');
            return;
        }

        // Get current segment data
        const currentSegment = currentSegmentsList[currentSegmentDisplayIndex];
        const segmentId = currentSegment.id !== undefined ? String(currentSegment.id) : 
                         currentSegmentDisplayIndex.toString().padStart(3, '0');
        
        // Get the text from the textarea
        const finalText = segmentTextArea.value;

        // Get the base filename from the current page (remove .png extension)
        const pageImageFilenameBase = currentPage.replace('.png', '');

        // Prepare the API request data
        const requestData = {
            user_id: userId,
            document_folder: currentSegmentFolderGlobal,
            page_image_filename_base: pageImageFilenameBase,
            segment_id_str: segmentId,
            final_text: finalText
        };

        console.log('Saving final segment text:', requestData);

        // Show loading state
        const originalText = segmentTextArea.style.backgroundColor;
        segmentTextArea.style.backgroundColor = '#fff3cd';
        segmentTextArea.disabled = true;

        // Make the API call
        fetch('/api/save_final_segment_text', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(requestData)
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                console.log('Final segment text saved successfully:', data);
                showAlert('success', 'Segment text saved successfully');
                
                // Visual feedback - brief green background
                segmentTextArea.style.backgroundColor = '#d4edda';
                segmentTextArea.style.borderColor = '#28a745';
                
                // Reset unsaved changes tracking
                if (typeof window.setOriginalSegmentText === 'function') {
                    window.setOriginalSegmentText(finalText);
                }
                
                // Update visual indicators to show this segment is now edited
                const titleEl = document.getElementById('sidebar-segment-title');
                if (titleEl) {
                    const segmentNumber = currentSegmentDisplayIndex + 1;
                    titleEl.textContent = `Preview of Segment ${segmentNumber} ✏️ (Edited)`;
                    titleEl.style.color = '#28a745';
                    titleEl.style.fontWeight = 'bold';
                    
                    // Update textarea styling to show it's been edited
                    segmentTextArea.style.backgroundColor = '#f8fff8';
                    segmentTextArea.style.borderLeftColor = '#28a745';
                    segmentTextArea.style.borderLeftWidth = '3px';
                }
                
                // Update dropdown to show edit indicator
                const segmentSelect = document.getElementById('segment-select');
                if (segmentSelect && segmentSelect.options[currentSegmentDisplayIndex + 1]) {
                    const option = segmentSelect.options[currentSegmentDisplayIndex + 1];
                    if (!option.textContent.includes('✏️')) {
                        // Remove any existing [FINAL] or other indicators first
                        let cleanText = option.textContent.replace(/\s*\[FINAL\]\s*|\s*✏️\s*/g, '');
                        option.textContent = `✏️ ${cleanText}`;
                        option.style.color = '#28a745';
                        option.style.fontWeight = 'bold';
                    }
                }
                
                // Reload segments to pick up the .final file and update OCR results
                setTimeout(() => {
                    if (currentSegmentFolderGlobal && currentSegmentPageIdGlobal) {
                        console.log('Reloading segments after save to pick up .final file');
                        loadLineSegments(currentSegmentFolderGlobal, currentSegmentPageIdGlobal)
                            .then(() => {
                                // After reload, re-select the same segment to show the updated state
                                if (currentSegmentDisplayIndex >= 0 && currentSegmentDisplayIndex < currentSegmentsList.length) {
                                    displaySegmentByIndex(currentSegmentDisplayIndex, false);
                                }
                            })
                            .catch(err => console.error('Error reloading segments:', err));
                    }
                }, 500);
                
                setTimeout(() => {
                    segmentTextArea.style.backgroundColor = '#fff3c4'; // Keep final segment background
                    segmentTextArea.style.borderColor = '#ffa726';
                }, 1000);
            } else {
                console.error('Failed to save final segment text:', data.message);
                showAlert('error', `Failed to save: ${data.message}`);
                segmentTextArea.style.backgroundColor = originalText;
            }
        })
        .catch(error => {
            console.error('Error saving final segment text:', error);
            showAlert('error', 'Error saving segment text. Please try again.');
            segmentTextArea.style.backgroundColor = originalText;
        })
        .finally(() => {
            segmentTextArea.disabled = false;
        });
    }
</script>
