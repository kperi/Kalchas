services:
  streamlitsrv:
    build: ./streamlitsrv
    ports:
      - "8502:8502"
    volumes:
      - .:/app
      - ./streamlitsrv:/app
      - upload_data:/app/data
    working_dir: /app
    depends_on:
      - ocr
      - doclayout
    networks:
      - logios-network

  doclayout:
    build: ./dlayout
    restart: on-failure
    ports:
      - "8602:8602"
    volumes:
      - .:/app
      - ./dlayout:/app
      - upload_data:/app/data
    working_dir: /app
    depends_on:
      - ocr
    networks:
      - logios-network

  ocr:
    build: ./ocr
    volumes:
      - .:/app
      - ./ocr:/app
      - upload_data:/app/data
    working_dir: /app
    networks:
      - logios-network

  ui:
    build:
      context: ./ui # Path to your Next.js app directory (where Dockerfile is)
      dockerfile: Dockerfile
    ports:
      - "3000:3000" # Map host port 3000 to container port 3000
    networks:
      - logios-network
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Add any other environment variables your Next.js app needs at runtime
      # Example: NEXT_PUBLIC_API_URL=http://backend-service:port/api
    restart: unless-stopped

volumes:
  upload_data:
  app:


networks:
  logios-network:
    driver: bridge
    name: logios-network
