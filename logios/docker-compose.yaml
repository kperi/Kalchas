services:
 
  doclayout:
    build: ./dlayout
    restart: unless-stopped
    ports:
      - "8602:8602"
    volumes:
      - .:/app
      - ./dlayout:/app
      - upload_data:/app/data
    working_dir: /app
    depends_on:
      - ocr
    networks:
      - logios-network

  ocr:
    build: ./ocr
    restart: unless-stopped
    volumes:
      - .:/app
      - ./ocr:/app
      - upload_data:/app/data
      - ./uploads:/app/uploads  # Add this line to mount uploads directory
    working_dir: /app
    networks:
      - logios-network
    ports:
      - "8000:8000"  # Add this to expose OCR service port

  vlm_ocr:
    build: ./vlm_ocr
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
    environment:
      - OCR_IMAGE_ROOT=/app/uploads
      - VLM_MODEL_ID=Qwen/Qwen2.5-VL-3B-Instruct
      - HF_HOME=/models/huggingface
    volumes:
      - ./uploads:/app/uploads:ro
      - vlm_model_cache:/models/huggingface
    networks:
      - logios-network
    ports:
      - "8001:8000"

  flaskui:
    build:
      context: ./my-flask-app
      dockerfile: Dockerfile
    ports:
      - "5001:5001" 
    volumes:
      - ./uploads:/app/uploads
      - ./my-flask-app:/app  # Mount the entire Flask app directory for live reload
      - /app/__pycache__  # Exclude pycache to avoid permission issues
    networks:
      - logios-network
    restart: unless-stopped
    environment:
      - FLASK_CONFIG=development
      - FLASK_DEBUG=true
      - FLASK_ENV=development
      - OCR_SERVICE_URL=http://ocr:8000
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be configured in .env}
    develop:
      watch:
        - action: sync
          path: ./my-flask-app
          target: /app
          ignore:
            - __pycache__/
            - "*.pyc"
            - .git/
        - action: rebuild
          path: ./my-flask-app/requirements.txt

volumes:
  upload_data:
  app:
  vlm_model_cache:

networks:
  logios-network:
    driver: bridge
    name: logios-network
