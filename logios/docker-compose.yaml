services:
  streamlitsrv:
    build: ./streamlitsrv
    ports:
      - "8502:8502"
    volumes:
      - .:/app
      - ./streamlitsrv:/app
      - upload_data:/app/data
    working_dir: /app
    depends_on:
      - ocr
      - doclayout
    networks:
      - logios-network

  doclayout:
    build: ./dlayout
    restart: on-failure
    ports:
      - "8602:8602"
    volumes:
      - .:/app
      - ./dlayout:/app
      - upload_data:/app/data
    working_dir: /app
    depends_on:
      - ocr
    networks:
      - logios-network

  ocr:
    build: ./ocr
    volumes:
      - .:/app
      - ./ocr:/app
      - upload_data:/app/data
    working_dir: /app
    networks:
      - logios-network

  flaskui:
    build:
      context: ./my-flask-app
      dockerfile: Dockerfile
    ports:
      - "5001:5001" # Assuming your Flask app inside the container runs on port 5001
    volumes:
      - ./uploads:/app/uploads  # Map local uploads to container path
    networks:
      - logios-network
    restart: unless-stopped

volumes:
  upload_data:
  app:


networks:
  logios-network:
    driver: bridge
    name: logios-network
