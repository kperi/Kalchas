services:
  streamlitsrv:
    build: ./streamlitsrv
    ports:
      - "8502:8502"
    volumes:
      - .:/app
      - ./streamlitsrv:/app
      - upload_data:/app/data
    working_dir: /app
    depends_on:
      - ocr
      - doclayout
    networks:
      - logios-network

  doclayout:
    build: ./dlayout
    restart: on-failure
    ports:
      - "8602:8602"
    volumes:
      - .:/app
      - ./dlayout:/app
      - upload_data:/app/data
    working_dir: /app
    depends_on:
      - ocr
    networks:
      - logios-network

  ocr:
    build: ./ocr
    volumes:
      - .:/app
      - ./ocr:/app
      - upload_data:/app/data
      - ./uploads:/app/uploads  # Add this line to mount uploads directory
    working_dir: /app
    networks:
      - logios-network
    ports:
      - "8000:8000"  # Add this to expose OCR service port

  flaskui:
    build:
      context: ./my-flask-app
      dockerfile: Dockerfile
    ports:
      - "5001:5001" 
    volumes:
      - ./uploads:/app/uploads
    networks:
      - logios-network
    restart: unless-stopped
    environment:
      - OCR_SERVICE_URL=http://ocr:8000  # Add this to specify OCR service URL

volumes:
  upload_data:
  app:

networks:
  logios-network:
    driver: bridge
    name: logios-network
